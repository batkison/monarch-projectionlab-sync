<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 440px; height: 280px; overflow: hidden; }
body {
  background:
    radial-gradient(300px 220px at 15% -10%, rgba(124,58,237,.32), transparent 65%),
    radial-gradient(300px 220px at 88% 115%, rgba(14,165,233,.30), transparent 65%),
    linear-gradient(160deg, #0b1120 0%, #131c33 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f1f5f9;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 14px;
}
.lockup { display: flex; align-items: center; gap: 10px; }
.pill {
  width: 52px; height: 52px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
}
.pill-m  { background: linear-gradient(135deg, #7c3aed, #a855f7); box-shadow: 0 0 22px rgba(124,58,237,.5); }
.pill-pl { background: linear-gradient(135deg, #0284c7, #38bdf8); box-shadow: 0 0 22px rgba(14,165,233,.5); }
.arrow svg { width: 26px; height: 26px; stroke: #94a3b8; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
h1 .m  { color: #c4b5fd; }
h1 .pl { color: #7dd3fc; }
p  { font-size: 14px; color: #94a3b8; }
</style></head>
<body>
  <div class="lockup">
    <div class="pill pill-m">M</div>
    <div class="arrow"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></div>
    <div class="pill pill-pl">PL</div>
  </div>
  <h1><span class="m">Monarch Money</span> → <span class="pl">ProjectionLab</span></h1>
  <p>One-click balance sync · preview first · private</p>
</body></html>
